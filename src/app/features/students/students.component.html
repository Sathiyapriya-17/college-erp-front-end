<div class="page-header">
    <div class="header-title">
        <h1>Student Information</h1>
        <p>Manage and monitor academic student records.</p>
    </div>
    <div class="header-actions">
        <button class="btn-primary" (click)="openAddModal()">
            <i class="fas fa-plus"></i> Enroll Student
        </button>
    </div>
</div>

<div class="dashboard-card">
    <div class="card-header">
        <div class="search-sort">
            <div class="search-box-page">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search by name, enrollment no...">
            </div>
        </div>
        <div class="filter-actions">
            <!-- Filter buttons can go here -->
        </div>
    </div>

    <div class="table-responsive">
        <table class="clean-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Student Name</th>
                    <th>Enrollment No</th>
                    <th>Department</th>
                    <th>Batch</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngIf="(students$ | async) as students">
                    <tr *ngFor="let student of students">
                        <td>#{{ student.id }}</td>
                        <td>
                            <div class="student-info">
                                <div class="avatar-sm">
                                    <i class="fas fa-user"></i>
                                </div>
                                <div>
                                    <span style="font-weight: 600; display: block;">{{ student.firstName }} {{
                                        student.lastName }}</span>
                                    <span style="font-size: 0.75rem; color: var(--text-muted);">{{ student.email
                                        }}</span>
                                </div>
                            </div>
                        </td>
                        <td>{{ student.enrollmentNo }}</td>
                        <td><span class="dept-badge">Dept {{ student.departmentId }}</span></td>
                        <td>{{ student.batch }}</td>
                        <td>
                            <button class="icon-btn-sm" (click)="onEdit(student)"><i class="fas fa-edit"></i></button>
                            <button class="icon-btn-sm danger" (click)="onDelete(student.id)"><i
                                    class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                </ng-container>
            </tbody>
        </table>
    </div>
</div>
