<div class="schooltec-module-container">
    <header class="module-header-row">
        <div class="header-info">
            <h1>Faculty Directory</h1>
            <p>Overview of our distinguished academic staff and faculty members.</p>
        </div>
        <div class="header-actions">
            <button class="btn-schooltec primary">
                <i class="fas fa-user-plus"></i> Add Faculty
            </button>
        </div>
    </header>

    <div class="faculty-grid-modern">
        <div class="schooltec-card faculty-card-modern" *ngFor="let member of faculty">
            <div class="faculty-badge-top">
                <span class="dept-label">{{ member.department }}</span>
            </div>

            <div class="faculty-profile-main">
                <div class="avatar-circle-lg">
                    {{ member.name[0] }}
                    <div class="online-status-dot"></div>
                </div>
                <div class="faculty-naming">
                    <h3>{{ member.name }}</h3>
                    <span class="role-text">{{ member.designation }}</span>
                </div>
            </div>

            <div class="faculty-contact-box">
                <div class="contact-item">
                    <i class="fas fa-envelope"></i>
                    <span>{{ member.email }}</span>
                </div>
            </div>

            <div class="faculty-card-footer">
                <button class="btn-schooltec-sm secondary">Message</button>
                <button class="btn-schooltec-sm primary">View Profile</button>
            </div>
        </div>
    </div>
</div>
