<div class="schooltec-login-page">
  <div class="login-container-modern">
    <!-- Left Section: 3D Illustration -->
    <div class="login-visual-panel">
      <div class="visual-content">
        <!-- Changed image to proper branding, added class for styling -->
        <!-- Note: User image name 'pachiayappa's college.webp' might have spaces/special chars. 
             Assuming standard assets path, but using a generic placeholder that WORKS if file missing 
             or the specific file if present. -->
        <div class="college-logo-large">
          <i class="fas fa-university"></i>
        </div>
        <div class="floating-blobs">
          <div class="blob b1"></div>
          <div class="blob b2"></div>
        </div>
      </div>
    </div>

    <!-- Right Section: Login Form -->
    <div class="login-form-panel">
      <div class="form-card-modern">
        <div class="form-header">
          <div class="brand-logotype">
            <img src="assets/logo.png" style="height: 40px; margin-right: 10px;" onerror="this.style.display='none'">
            <i class="fas fa-graduation-cap" style="margin-right: 10px;" *ngIf="true"></i>
            <span>Pachaiyappa's College</span>
          </div>
          <h1 style="color: var(--text-main);">Welcome Back</h1>
          <p>Sign in to your account</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="modern-form">
          <!-- Role Selection -->
          <div class="role-pills">
            <label *ngFor="let r of roles" class="pill-option"
              [class.active]="loginForm.get('role')?.value === r.value">
              <input type="radio" formControlName="role" [value]="r.value">
              <span>{{ r.label }}</span>
            </label>
          </div>

          <div class="input-group-modern">
            <label>Username / Email</label>
            <div class="input-field-wrapper">
              <i class="fas fa-envelope"></i>
              <input type="text" formControlName="username" placeholder="Enter username (e.g. rajesh12)"
                [class.error]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            </div>
          </div>

          <div class="input-group-modern">
            <div class="lbl-row">
              <label>Password</label>
              <!-- <a href="#" class="forgot-link">Forgot?</a> -->
            </div>
            <div class="input-field-wrapper">
              <i class="fas fa-lock"></i>
              <input type="password" formControlName="password" placeholder="Enter password"
                [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            </div>
          </div>

          <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn-login-modern">
            <span *ngIf="!isLoading">Login <i class="fas fa-arrow-right"></i></span>
            <span *ngIf="isLoading" class="loader-simple"></span>
          </button>

          <div class="modern-toast error" *ngIf="error">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
